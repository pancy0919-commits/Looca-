<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Disney+ Style 影音平台</title>
    <style>
        :root {
            --bg-color: #0f1014;
            --card-bg: #1a1c23;
            --accent-color: #0072d2;
            --gold-color: #ffc107;
            --text-color: #f9f9f9;
            --text-gray: #8f9ba8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
        }

        /* ================= 登入/註冊畫面樣式 ================= */
        #loginView {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(rgba(15,16,20,0.85), rgba(15,16,20,0.85)),
                        url('https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=1500&q=80') center/cover;
            text-align: center;
            padding: 20px;
        }

        .login-box {
            background-color: rgba(26, 28, 35, 0.95);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .login-box h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .login-box p {
            color: var(--text-gray);
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #333846;
            background-color: #12141c;
            color: white;
            font-size: 14px;
        }

        .role-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-guest { background-color: #333846; color: white; }
        .btn-vip { background: linear-gradient(45deg, #ff9800, #ffc107); color: #000; }
        .btn-admin { background-color: var(--accent-color); color: white; }

        .role-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .switch-mode {
            margin-top: 15px;
            font-size: 13px;
            color: var(--text-gray);
            cursor: pointer;
        }

        .switch-mode span {
            color: var(--accent-color);
            font-weight: bold;
        }

        .switch-mode span:hover {
            text-decoration: underline;
        }

        .admin-input-group {
            display: none;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        /* ================= 主平台畫面樣式 ================= */
        #appView {
            display: none;
            min-height: 100vh;
        }

        sidebar {
            width: 80px;
            background-color: #030407;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
            position: fixed;
            height: 100%;
            z-index: 10;
        }

        .logo {
            font-size: 24px;
            margin-bottom: 40px;
            color: var(--accent-color);
            font-weight: bold;
        }

        main {
            margin-left: 80px;
            flex: 1;
            padding: 40px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .user-status {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-guest { background-color: #555; color: white; }
        .badge-vip { background-color: var(--gold-color); color: black; }
        .badge-admin { background-color: var(--accent-color); color: white; }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--text-gray);
            color: var(--text-gray);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .hero {
            background: linear-gradient(to right, rgba(15,16,20,0.9) 30%, rgba(15,16,20,0.2) 100%), 
                        url('https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?auto=format&fit=crop&w=1200&q=80') center/cover;
            height: 300px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 30px;
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 20px;
            color: var(--text-gray);
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .video-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            transition: transform 0.3s;
            cursor: pointer;
        }

        .video-card:hover {
            transform: translateY(-5px);
        }

        .thumbnail {
            width: 100%;
            height: 140px;
            background-size: cover;
            background-position: center;
        }

        .video-info {
            padding: 15px;
        }

        .vip-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: var(--gold-color);
            color: black;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
        }

        .lock-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--gold-color);
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            padding: 10px;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Modal 彈出視窗共用樣式 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background-color: #1e212b;
            padding: 30px;
            border-radius: 16px;
            width: 450px;
            max-width: 90%;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--text-gray); }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 10px; border-radius: 6px;
            border: 1px solid #333846; background-color: #12141c; color: white;
        }
    </style>
</head>
<body>

    <!-- 1. 登入/註冊畫面 -->
    <div id="loginView">
        <div class="login-box">
            <h1 id="boxTitle">歡迎來到影音庫</h1>
            <p id="boxSubtitle">請登入您的帳號以繼續</p>

            <div id="authForm">
                <input type="email" id="inputEmail" class="form-input" placeholder="電子郵件信箱">
                <input type="password" id="inputPassword" class="form-input" placeholder="密碼">
                <button class="role-btn btn-admin" id="submitAuthBtn" onclick="handleAuth()">登入帳號</button>
            </div>

            <div style="margin: 15px 0; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
                <button class="role-btn btn-vip" onclick="loginDirect('vip')">💎 花錢享受更多 (一鍵解鎖 VIP)</button>
                <button class="role-btn btn-guest" onclick="loginDirect('guest')">👤 以訪客身分快速瀏覽</button>
            </div>

            <div class="switch-mode" id="switchModeText" onclick="toggleMode()">
                還沒有帳號？ <span>立即註冊新帳號</span>
            </div>
        </div>
    </div>

    <!-- 2. 主平台畫面 -->
    <div id="appView">
        <sidebar>
            <div class="logo">▶</div>
        </sidebar>

        <main>
            <header>
                <h1>My Studio 影音庫</h1>
                <div class="user-status">
                    <span id="roleBadge" class="badge"></span>
                    <!-- 任何會員都可以點擊，但點下去會檢查是否輸入工人密碼 -->
                    <button class="btn" onclick="checkWorkerPermission()">＋ 上傳/新增專案影片</button>
                    <button class="btn-logout" onclick="logout()">登出</button>
                </div>
            </header>

            <div class="hero">
                <h2>專屬影片專案平台</h2>
                <p>收錄自製遊戲展示、製作過程記錄與尊享專案。</p>
            </div>

            <div class="section-title">所有專案影片</div>
            <div class="video-grid" id="videoGrid"></div>
        </main>
    </div>

    <!-- 工人密碼驗證 Modal -->
    <div class="modal" id="workerPasswordModal">
        <div class="modal-content" style="text-align: center; width: 380px;">
            <h3>🛠️ 工人身分驗證</h3>
            <p style="color: var(--text-gray); font-size: 13px; margin: 10px 0 20px 0;">上傳與編輯專案需要輸入工人管理者密碼</p>
            <div class="form-group">
                <input type="password" id="workerInputPwd" placeholder="請輸入工人密碼" style="text-align: center; font-size: 16px;">
            </div>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                <button class="btn-logout" onclick="closeWorkerModal()">取消</button>
                <button class="btn" onclick="verifyWorker()">確認進入上傳</button>
            </div>
        </div>
    </div>

    <!-- 新增/上傳影片 Modal (限工人) -->
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <h3>上傳/新增專案影片</h3>
            <div class="form-group">
                <label>影片標題</label>
                <input type="text" id="videoTitle" placeholder="例如：皮克敏最新實驗室遊玩">
            </div>
            <div class="form-group">
                <label>封面圖片網址 (URL)</label>
                <input type="text" id="videoThumb" placeholder="貼入圖片網址">
            </div>
            <div class="form-group">
                <label>影片網址 (YouTube 嵌入連結或 MP4)</label>
                <input type="text" id="videoUrl" placeholder="https://www.youtube.com/embed/...">
            </div>
            <div class="form-group">
                <label>專案權限等級</label>
                <select id="videoLevel">
                    <option value="free">免費 (訪客與VIP皆可看)</option>
                    <option value="vip">VIP 獨家 (僅 VIP 與工人可看)</option>
                </select>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                <button class="btn-logout" onclick="closeUploadModal()">取消</button>
                <button class="btn" onclick="saveVideo()">確認上傳專案</button>
            </div>
        </div>
    </div>

    <script>
        // 設定工人的專屬密碼 (你可以隨時在這裡更改)
        const WORKER_PASSWORD = "1234"; 

        let currentRole = null;
        let isRegisterMode = false;

        let videos = JSON.parse(localStorage.getItem('myVideos_v5')) || [
            {
                title: "皮克敏實驗室遊戲展示",
                thumb: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=600&q=80",
                url: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                level: "free"
            },
            {
                title: "自製夏日冰檸檬茶教學",
                thumb: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=600&q=80",
                url: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                level: "free"
            },
            {
                title: "★ 尊享版：天神模擬器獨家開發秘辛",
                thumb: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80",
                url: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                level: "vip"
            }
        ];

        function toggleMode() {
            isRegisterMode = !isRegisterMode;
            const title = document.getElementById('boxTitle');
            const subtitle = document.getElementById('boxSubtitle');
            const btn = document.getElementById('submitAuthBtn');
            const switchText = document.getElementById('switchModeText');

            if (isRegisterMode) {
                title.innerText = "註冊新帳號";
                subtitle.innerText = "建立您的專屬會員資料";
                btn.innerText = "註冊並登入";
                switchText.innerHTML = '已經有帳號了？ <span>直接登入</span>';
            } else {
                title.innerText = "歡迎來到影音庫";
                subtitle.innerText = "請登入您的帳號以繼續";
                btn.innerText = "登入帳號";
                switchText.innerHTML = '還沒有帳號？ <span>立即註冊新帳號</span>';
            }
        }

        function handleAuth() {
            const email = document.getElementById('inputEmail').value.trim();
            const password = document.getElementById('inputPassword').value.trim();

            if (!email || !password) {
                alert('請完整填寫電子郵件與密碼！');
                return;
            }

            let users = JSON.parse(localStorage.getItem('myUsers')) || {};

            if (isRegisterMode) {
                if (users[email]) {
                    alert('這個電子郵件已經被註冊過了！請直接登入。');
                    return;
                }
                users[email] = password;
                localStorage.setItem('myUsers', JSON.stringify(users));
                alert('註冊成功！已自動幫您登入 VIP。');
                loginDirect('vip');
            } else {
                if (users[email] && users[email] === password) {
                    alert('登入成功！歡迎回來，' + email);
                    loginDirect('vip');
                } else if (!users[email]) {
                    alert('找不到此信箱帳號！請先點擊下方註冊新帳號。');
                } else {
                    alert('密碼錯誤！');
                }
            }
        }

        function loginDirect(role) {
            currentRole = role;
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('appView').style.display = 'flex';

            const badge = document.getElementById('roleBadge');
            if (role === 'guest') {
                badge.innerText = "訪客模式";
                badge.className = "badge badge-guest";
            } else if (role === 'vip') {
                badge.innerText = "VIP 尊享會員";
                badge.className = "badge badge-vip";
            }

            renderVideos();
        }

        function logout() {
            currentRole = null;
            document.getElementById('inputEmail').value = '';
            document.getElementById('inputPassword').value = '';
            document.getElementById('loginView').style.display = 'flex';
            document.getElementById('appView').style.display = 'none';
        }

        // 點擊上傳按鈕時，先跳出工人密碼輸入框
        function checkWorkerPermission() {
            document.getElementById('workerInputPwd').value = '';
            document.getElementById('workerPasswordModal').style.display = 'flex';
        }

        function closeWorkerModal() {
            document.getElementById('workerPasswordModal').style.display = 'none';
        }

        // 驗證工人密碼
        function verifyWorker() {
            const pwd = document.getElementById('workerInputPwd').value;
            if (pwd === WORKER_PASSWORD) {
                closeWorkerModal();
                document.getElementById('uploadModal').style.display = 'flex';
            } else {
                alert('工人密碼錯誤！無法上傳影片。');
            }
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').style.display = 'none';
        }

        function renderVideos() {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';

            videos.forEach((video) => {
                const card = document.createElement('div');
                card.className = 'video-card';

                const isVipVideo = video.level === 'vip';
                // 只要是 VIP 或工人權限（能通過上傳驗證的都算有權限看），或者影片是免費的就能看
                const canWatch = currentRole === 'vip' || !isVipVideo;

                card.innerHTML = `
                    <div class="thumbnail" style="background-image: url('${video.thumb}')"></div>
                    ${isVipVideo ? '<div class="vip-tag">VIP 獨家</div>' : ''}
                    ${!canWatch ? '<div class="lock-overlay">🔒 點擊花錢享受更多解鎖 VIP</div>' : ''}
                    <div class="video-info">
                        <div style="font-weight: bold;">${video.title}</div>
                    </div>
                `;

                card.onclick = () => {
                    if (canWatch) {
                        window.open(video.url, '_blank');
                    } else {
                        alert('這是 VIP 獨家專案！請登出並點擊「花錢享受更多」或註冊解鎖！');
                    }
                };

                grid.appendChild(card);
            });
        }

        function saveVideo() {
            const title = document.getElementById('videoTitle').value;
            const thumb = document.getElementById('videoThumb').value || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80';
            const url = document.getElementById('videoUrl').value || '#';
            const level = document.getElementById('videoLevel').value;

            if (!title) return alert('請填寫標題！');

            videos.push({ title, thumb, url, level });
            localStorage.setItem('myVideos_v5', JSON.stringify(videos));

            closeUploadModal();
            renderVideos();
            alert('成功上傳新專案影片！');
        }
    </script>
</body>
</html>
